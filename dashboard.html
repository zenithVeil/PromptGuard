<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptGuard Firewall · Live Monitor</title>
  <style>
    :root { color-scheme: dark; --bg: #080b12; --panel: #101621; --line: #263246; --text: #e9eef8; --muted: #8d9ab0; --green: #38e58b; --red: #ff5268; --amber: #f4bd55; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 80% -10%, #182747 0, var(--bg) 42%); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 100vh; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 52px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    .kicker { color: var(--green); font-size: .75rem; letter-spacing: .18em; }
    h1 { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.06em; margin: 10px 0 0; }
    .status { border: 1px solid var(--line); background: rgba(16,22,33,.8); padding: 16px 20px; min-width: 190px; }
    .status-label { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .13em; margin-bottom: 8px; }
    #protection { font-size: 1.15rem; font-weight: 800; }
    .on { color: var(--green); } .off { color: var(--amber); }
    .banner { display: none; margin: 26px 0 18px; padding: 20px 22px; border: 2px solid; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 800; font-size: 1.2rem; }
    .banner.visible { display: block; } .banner.red { color: #ffd7dc; border-color: var(--red); background: rgba(120, 13, 34, .35); } .banner.green { color: #c8ffe1; border-color: var(--green); background: rgba(10, 99, 55, .3); }
    .panel { margin-top: 26px; border: 1px solid var(--line); background: rgba(16,22,33,.86); }
    .panel-head { display: flex; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .78rem; letter-spacing: .12em; }
    #trace { margin: 0; padding: 10px 18px 20px; min-height: 280px; white-space: pre-wrap; overflow-wrap: anywhere; color: #c9d4e7; line-height: 1.7; font-size: .88rem; }
    .flagged, .blocked { color: #ff91a0; } .allowed { color: var(--green); } .empty { color: var(--muted); }
    @media (max-width: 700px) { header { display: block; } .status { margin-top: 22px; } .shell { width: min(100% - 24px, 1180px); } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="kicker">PROMPTGUARD / FIREWALL</div><h1>Live monitor</h1></div>
      <div class="status"><span class="status-label">PROTECTION MODE</span><span id="protection">CHECKING…</span></div>
    </header>
    <div id="red-banner" class="banner red">THREAT SIGNAL: canary detected or tool action blocked.</div>
    <div id="green-banner" class="banner green">ATTACK BLOCKED: flagged content could not reach the tool boundary.</div>
    <section class="panel">
      <div class="panel-head"><span>LIVE TRACE LOG</span><span id="updated">waiting</span></div>
      <pre id="trace"><span class="empty">Waiting for gateway events…</span></pre>
    </section>
  </div>
  <script>
    const protection = document.getElementById("protection");
    const trace = document.getElementById("trace");
    const redBanner = document.getElementById("red-banner");
    const greenBanner = document.getElementById("green-banner");
    const updated = document.getElementById("updated");

    function renderHealth(data) {
      protection.textContent = data.protected ? "PROTECTED: ON" : "PROTECTED: OFF";
      protection.className = data.protected ? "on" : "off";
    }

    function renderEvents(events) {
      const threat = events.some(event => event.canary_triggered || event.allowed === false);
      const blockedAttack = events.some(event => event.event_type === "action" && event.allowed === false);
      redBanner.classList.toggle("visible", threat);
      greenBanner.classList.toggle("visible", blockedAttack);
      trace.innerHTML = events.length
        ? events.map(event => `<span class="${event.allowed === false || event.flagged ? "blocked" : event.canary_triggered ? "flagged" : "allowed"}">${escapeHtml(event.trace_line)}</span>`).join("\n")
        : '<span class="empty">No events yet…</span>';
      updated.textContent = `updated ${new Date().toLocaleTimeString()}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character]));
    }

    async function poll() {
      try {
        const [healthResponse, eventsResponse] = await Promise.all([fetch("/health"), fetch("/events")]);
        renderHealth(await healthResponse.json());
        renderEvents(await eventsResponse.json());
      } catch (error) {
        protection.textContent = "GATEWAY UNAVAILABLE";
        protection.className = "off";
        updated.textContent = "poll failed";
      }
    }

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
